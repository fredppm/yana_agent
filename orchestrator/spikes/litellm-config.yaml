# LiteLLM proxy config — roteia chamadas OpenAI-compatible para AWS Bedrock
# Graphiti-core conecta aqui em vez de OpenAI diretamente
#
# Credenciais AWS são lidas do ambiente (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# AWS_DEFAULT_REGION) — não hardcode aqui.

model_list:
  - model_name: bedrock-claude          # sonnet — usado para operações complexas
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region_name: us-east-1

  - model_name: bedrock-claude-haiku    # haiku — extração de entidades (barato)
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: us-east-1

  - model_name: bedrock-embed           # embeddings via Amazon Titan
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0
      aws_region_name: us-east-1

litellm_settings:
  drop_params: true   # ignora params que Bedrock não suporta (ex: logprobs)
