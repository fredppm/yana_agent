llm:
  litellm_url: "http://localhost:4000"
  routing:
    conversation: bedrock-claude-sonnet
    conversation_fast: bedrock-claude-haiku
    pulse_scheduled: bedrock-claude-haiku
    pulse_triggered: bedrock-claude-haiku
    sanctum_write: bedrock-claude-haiku
    first_breath: bedrock-claude-sonnet

engines:
  # Coding engine for programmer mode (Story 0.1).
  # default: name of the engine implementation to use.
  # claude_code: config passed to ClaudeCodeEngine.__init__()
  default: claude_code
  claude_code:
    sdk: subprocess           # subprocess (current) | anthropic_agent (future SDK)
    model: claude-sonnet-4-6  # passed to claude --model; remove to use Claude Code's default
    flags: []                 # extra CLI flags (e.g. ["--dangerously-skip-permissions"])

graphiti:
  enabled: false             # set true after running orchestrator/spikes/docker-compose.yml
  uri: "bolt://localhost:7687"
  user: ""
  password: ""
  litellm_url: "http://localhost:4000"
  model: "bedrock-claude-haiku"
  embed_model: "bedrock-embed"
  group_id: "yana-fred"      # one per YANA instance; yana-esposa gets its own group

stt:
  provider: faster-whisper   # openai-whisper | faster-whisper
  model: tiny                # tiny | base | small | medium | large
  language: pt               # primary language hint

tts:
  provider: edge-tts
  voice: pt-BR-FranciscaNeural
  rate: +0%
  volume: +0%
