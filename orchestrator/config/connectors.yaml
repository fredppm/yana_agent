connectors:
  # Python connectors — garmin-connect-mcp blocked (fastmcp 3.x API break + no interactive auth)
  - type: GarminActivityConnector
    id: garmin_fred
    name: "Garmin do Fred"
    description: "Dados de saúde e atividade física do Fred — passos, sono, stress, corridas"
    owner: fred
    config:
      credentials_file: "~/.yana/credentials/garmin_fred.json"
      token_dir: "~/.yana/tokens/garmin_fred"

  - type: GarminActivityConnector
    id: garmin_ana
    name: "Garmin da Ana"
    description: "Dados de saúde e atividade física da Ana — passos, sono, stress, corridas"
    owner: ana
    config:
      credentials_file: "~/.yana/credentials/garmin_ana.json"
      token_dir: "~/.yana/tokens/garmin_ana"

  - type: GoogleCalendarMCPConnector
    id: calendar_fred
    name: "Agenda do Fred"
    description: "Eventos e compromissos do calendário pessoal do Fred"
    owner: fred
    config:
      credentials_file: "~/.yana/google_credentials.json"
      token_file: "~/.yana/tokens/calendar_fred.json"

  - type: GoogleTasksConnector
    id: tasks_fred
    name: "Tasks do Fred"
    description: "Tarefas pessoais do Fred — criar, completar e consultar tasks"
    owner: fred
    config:
      credentials_file: "~/.yana/google_credentials.json"
      token_file: "~/.yana/tokens/tasks_fred.json"

  # Gmail — backend: mcp-google-gmail (pip/uvx)
  # First-time auth per account: uvx mcp-google-gmail@latest auth
  # The server manages OAuth tokens in its own default paths after auth.
  - type: GmailMCPConnector
    id: gmail_fred_personal
    name: "Gmail pessoal do Fred"
    description: "Email pessoal do Fred — inbox importante, busca, envio"
    owner: fred
    config:
      mcp_command: ["uvx", "mcp-google-gmail@latest"]

  - type: GmailMCPConnector
    id: gmail_fred_work
    name: "Gmail trabalho do Fred"
    description: "Email de trabalho do Fred — inbox importante, busca, envio"
    owner: fred
    config:
      mcp_command: ["uvx", "mcp-google-gmail@latest"]

  - type: RGBLightConnector
    id: rgb_sala
    name: "Luz da Sala"
    description: "Luz RGB da sala de estar"

  - type: RGBLightConnector
    id: rgb_banheiro
    name: "Luz do Banheiro"
    description: "Luz RGB do banheiro"
