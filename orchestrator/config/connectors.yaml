connectors:
  # MCP-backed Garmin connectors (garmin-connect-mcp via eddmann/garmin-connect-mcp)
  # Auth: run `GARMINTOKENS=~/.yana/tokens/garmin_fred garmin-connect-mcp auth` once per user
  - type: GarminMCPConnector
    id: garmin_fred
    name: "Garmin do Fred"
    description: "Dados de saúde e atividade física do Fred — passos, sono, stress, corridas"
    owner: fred
    config:
      mcp_command: ["garmin-connect-mcp"]
      env:
        GARMINTOKENS: "~/.yana/tokens/garmin_fred"

  - type: GarminMCPConnector
    id: garmin_ana
    name: "Garmin da Ana"
    description: "Dados de saúde e atividade física da Ana — passos, sono, stress, corridas"
    owner: ana
    config:
      mcp_command: ["garmin-connect-mcp"]
      env:
        GARMINTOKENS: "~/.yana/tokens/garmin_ana"

  - type: GoogleCalendarConnector
    id: calendar_fred
    name: "Agenda do Fred"
    description: "Eventos e compromissos do calendário pessoal do Fred"
    owner: fred
    config:
      credentials_file: "~/.yana/google_credentials.json"
      token_file: "~/.yana/tokens/calendar_fred.json"

  - type: GoogleTasksConnector
    id: tasks_fred
    name: "Tasks do Fred"
    description: "Tarefas pessoais do Fred — criar, completar e consultar tasks"
    owner: fred
    config:
      credentials_file: "~/.yana/google_credentials.json"
      token_file: "~/.yana/tokens/tasks_fred.json"

  - type: RGBLightConnector
    id: rgb_sala
    name: "Luz da Sala"
    description: "Luz RGB da sala de estar"

  - type: RGBLightConnector
    id: rgb_banheiro
    name: "Luz do Banheiro"
    description: "Luz RGB do banheiro"
