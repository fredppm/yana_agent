connectors:
  # -------------------------------------------------------------------------
  # Credential naming convention:
  #   app_credential      — OAuth Client ID/Secret or API key. YANA owns. Immutable.
  #   persona_token       — Per-user OAuth token. Persona owns. Expires and refreshes.
  #   persona_credentials — Username/password file (Garmin only). Persona owns.
  #   persona_token_dir   — Token directory for garth-based auth (Garmin only).
  # -------------------------------------------------------------------------

  # Python connectors — garmin-connect-mcp blocked (fastmcp 3.x API break + no interactive auth)
  - type: GarminActivityConnector
    id: garmin_fred
    name: "Garmin do Fred"
    description: "Dados de saúde e atividade física do Fred — passos, sono, stress, corridas"
    owner: fred
    config:
      persona_credentials: "~/.yana/credentials/garmin_fred.json"
      persona_token_dir: "~/.yana/tokens/garmin_fred"

  - type: GarminActivityConnector
    id: garmin_ana
    name: "Garmin da Ana"
    description: "Dados de saúde e atividade física da Ana — passos, sono, stress, corridas"
    owner: ana
    config:
      persona_credentials: "~/.yana/credentials/garmin_ana.json"
      persona_token_dir: "~/.yana/tokens/garmin_ana"

  - type: GoogleCalendarConnector
    id: calendar_fred
    name: "Agenda do Fred"
    description: "Eventos e compromissos do calendário pessoal do Fred"
    owner: fred
    config:
      app_credential: "~/.yana/google_credentials.json"
      persona_token: "~/.yana/tokens/calendar_fred.json"

  - type: GoogleTasksConnector
    id: tasks_fred
    name: "Tasks do Fred"
    description: "Tarefas pessoais do Fred — criar, completar e consultar tasks"
    owner: fred
    config:
      app_credential: "~/.yana/google_credentials.json"
      persona_token: "~/.yana/tokens/tasks_fred.json"

  # Gmail — direct Gmail API (google-api-python-client, no MCP subprocess)
  # On first YANA startup, a browser window opens for OAuth consent.
  # Token is saved to persona_token and reused on subsequent runs.
  - type: GmailConnector
    id: gmail_fred_personal
    name: "Gmail pessoal do Fred"
    description: "Email pessoal do Fred — inbox importante, busca, envio"
    owner: fred
    config:
      app_credential: "~/.yana/google_credentials.json"
      persona_token: "~/.yana/tokens/gmail_fred_personal.json"

  - type: GmailConnector
    id: gmail_fred_work
    name: "Gmail VTEX do Fred"
    description: "Email de trabalho do Fred — inbox importante, busca, envio"
    owner: fred
    config:
      app_credential: "~/.yana/google_credentials.json"
      persona_token: "~/.yana/tokens/gmail_fred_work.json"

  # Contacts — persona and contact resolution for the LLM
  - type: ContactsConnector
    id: contacts
    name: "Contacts"
    description: "Resolve personas and contacts — find who someone is and how to reach them"
    config:
      personas_file: "orchestrator/config/personas.yaml"
      contacts_file: "orchestrator/config/contacts.yaml"

  - type: RGBLightConnector
    id: rgb_sala
    name: "Luz da Sala"
    description: "Luz RGB da sala de estar"

  - type: RGBLightConnector
    id: rgb_banheiro
    name: "Luz do Banheiro"
    description: "Luz RGB do banheiro"

  - type: InternalConnector
    id: internal
    name: "Internal"
    description: "Operações internas da YANA — lembretes e mensagens simples sem serviço externo"

  # Pulse task manager — requires `python -m pulse` to be running
  - type: PulseManagerConnector
    id: pulse
    name: "Pulse"
    description: "Agenda tarefas autônomas do Pulse — criar, listar e remover"
    config:
      host: "127.0.0.1"  # change to remote IP for distributed deploy
      port: 7891
