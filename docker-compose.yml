services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7687:7687"   # Bolt protocol — used by graphiti-core
      # - "7474:7474"   # Neo4j browser (optional — comment out if port already in use)
    environment:
      - NEO4J_AUTH=none   # no auth for local dev
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=yana
    volumes:
      - postgres_data:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"   # OpenAI-compatible API endpoint
    volumes:
      - ./orchestrator/config/litellm.yaml:/app/config.yaml
      - ${USERPROFILE}/.aws:/root/.aws:ro   # mount host AWS credentials (supports profiles)
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - neo4j

volumes:
  neo4j_data:
  postgres_data:
